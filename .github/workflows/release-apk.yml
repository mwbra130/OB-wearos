name: Attach APK to release

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  attach-apk:
    name: Build and attach unsigned watch APK
    runs-on: windows-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build unsigned debug APK
        run: .\gradlew.bat :wear:assembleDebug

      - name: Name the APK after the release
        shell: pwsh
        run: |
          $name = "OpenBubblesWear-${{ github.event.release.tag_name }}-unsigned.apk"
          Copy-Item "wear/build/outputs/apk/debug/wear-debug-unsigned.apk" $name
          echo "APK_NAME=$name" >> $env:GITHUB_ENV

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.APK_NAME }}" --clobber
